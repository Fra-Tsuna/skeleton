defaults:
  - _self_
  - accelerator: default
  - model: default
  - optimizer: adamw
  - lr_scheduler: cosine
  - dataloader@train_dataloader: train
  - dataloader@val_dataloader: val
  - trainer: default
  - wandb: default
  - experiment: null
  - override hydra/hydra_logging: colorlog
  - override hydra/job_logging: colorlog

name: project
seed: 42
original_work_dir: ${hydra:runtime.cwd}
data_root: ${original_work_dir}/data
ckpt_root: ${original_work_dir}/ckpt
result_dir: ${hydra:runtime.output_dir}
resume_from: null

hydra:
  job:
    chdir: false
  run:
    dir: ${original_work_dir}/outputs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${original_work_dir}/multirun/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
